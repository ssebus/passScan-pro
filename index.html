<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PassScan Extreme - Ultimate Pink</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #1a051d, #2e0836, #0f0212);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 50px;
        }

        /* Różowy Nagłówek i Statystyki */
        .header-card {
            background: rgba(45, 10, 56, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.2);
        }
        .app-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: #f472b6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }
        .stat-box {
            background: rgba(20, 4, 26, 0.6);
            border: 1px solid rgba(244, 114, 182, 0.1);
            padding: 8px 4px;
            border-radius: 14px;
        }
        .stat-num {
            font-size: 1.1rem;
            font-weight: bold;
            color: #34d399;
        }
        .stat-lbl {
            font-size: 0.62rem;
            color: #f7a8d8;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 700;
        }

        /* Przełącznik Wejście / Wyjście */
        .direction-toggle {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(20, 4, 26, 0.8);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(244, 114, 182, 0.15);
            margin-bottom: 10px;
        }
        .dir-btn {
            background: transparent;
            border: none;
            color: #f7a8d8;
            padding: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .dir-btn.active-in { background: #059669; color: white; }
        .dir-btn.active-out { background: #dc2626; color: white; }

        /* Zakładki */
        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: rgba(20, 4, 26, 0.85);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid rgba(244, 114, 182, 0.15);
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #f7a8d8;
            padding: 10px 2px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #db2777, #f472b6);
            color: white;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.5);
        }

        .panel { display: none; flex-direction: column; gap: 12px; }
        .panel.active { display: flex; }

        .card {
            background: rgba(45, 10, 56, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 114, 182, 0.15);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* Kamera i podgląd natywny */
        .camera-box {
            position: relative;
            width: 100%;
            height: 240px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #db2777;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #scanner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scanner-laser {
            position: absolute;
            width: 80%;
            height: 2px;
            background: #f472b6;
            box-shadow: 0 0 12px #f472b6;
            animation: scanAnim 2s infinite ease-in-out;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes scanAnim {
            0% { top: 15%; } 50% { top: 85%; } 100% { top: 15%; }
        }

        /* Formularze i przyciski */
        .form-group { margin-bottom: 10px; }
        label {
            display: block;
            font-size: 0.72rem;
            color: #f7a8d8;
            margin-bottom: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        input, select, textarea {
            width: 100%;
            background: rgba(15, 2, 18, 0.85);
            border: 1px solid #701a75;
            color: white;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #f472b6; }
        .btn {
            background: linear-gradient(135deg, #db2777, #be185d);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #991b1b); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .btn-success { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4); }
        .btn-purple { background: linear-gradient(135deg, #7c3aed, #5b21b6); box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }

        /* Lista biletów */
        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .ticket-item {
            background: rgba(20, 4, 26, 0.75);
            border: 1px solid rgba(244, 114, 182, 0.1);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-code {
            font-family: monospace;
            font-size: 0.9rem;
            color: #f472b6;
            font-weight: bold;
        }
        .ticket-meta { font-size: 0.68rem; color: #f7a8d8; }
        .ticket-actions { display: flex; gap: 5px; }
        .icon-btn {
            background: #581c87;
            color: white;
            border: none;
            width: 30px; height: 30px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .row-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* --- PEŁNOEKRANOWE MODALE WYNIKÓW (ANIMOWANE) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: fadeInModal 0.25s ease-out;
        }
        @keyframes fadeInModal {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-card {
            width: 100%;
            max-width: 380px;
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            position: relative;
        }
        .modal-success { background: linear-gradient(135deg, #064e3b, #022c22); border: 2px solid #34d399; }
        .modal-error { background: linear-gradient(135deg, #7f1d1d, #450a0a); border: 2px solid #ef4444; }

        .modal-icon-circle {
            width: 90px; height: 90px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            animation: bounceIcon 0.6s infinite alternate;
        }
        .success-circle { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 2px solid #34d399; }
        .error-circle { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 2px solid #ef4444; }

        @keyframes bounceIcon {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .modal-title { font-size: 1.4rem; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .modal-code-txt { font-family: monospace; font-size: 1.2rem; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 10px; color: #fff; width: 100%; word-break: break-all; }
        .modal-desc { font-size: 0.9rem; color: #cbd5e1; margin: 0; }
        
        .close-modal-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px;
            border-radius: 14px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 10px;
        }
        .close-x-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent; border: none;
            color: white; font-size: 1.4rem; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .timer-bar-container {
            width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden;
            margin-top: 5px;
        }
        .timer-bar-fill {
            width: 100%; height: 100%; background: white;
            animation: shrinkBar 5s linear forwards;
        }
        @keyframes shrinkBar {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Nagłówek Statystyk -->
        <div class="header-card">
            <div class="app-title">
                <span>🎟️ PassScan Extreme Pink</span>
                <span id="db-count" style="font-size:0.75rem; color:#f7a8d8;">0 kodów</span>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num" id="stat-total">0</div>
                    <div class="stat-lbl">Baza</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="stat-scanned" style="color:#f472b6;">0</div>
                    <div class="stat-lbl">Wejścia</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="stat-max">150</div>
                    <div class="stat-lbl">Limit</div>
                </div>
            </div>
        </div>

        <!-- Menu Nawigacji -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('scan')">📷 Skaner</button>
            <button class="tab-btn" onclick="switchTab('generator')">⚡ Generator</button>
            <button class="tab-btn" onclick="switchTab('database')">📋 Baza</button>
            <button class="tab-btn" onclick="switchTab('settings')">⚙️ Ustawienia</button>
        </div>

        <!-- PANEL 1: SKANER KAMERY -->
        <div class="panel active" id="panel-scan">
            <div class="direction-toggle" id="directionToggleBar">
                <button class="dir-btn active-in" id="btnModeIn" onclick="setScanDirection('in')">📥 WEJŚCIE</button>
                <button class="dir-btn" id="btnModeOut" onclick="setScanDirection('out')">📤 WYJŚCIE</button>
            </div>

            <div class="card">
                <div class="camera-box">
                    <video id="scanner-video" autoplay playsinline muted></video>
                    <div class="scanner-laser"></div>
                </div>
                <div style="margin-top: 10px; display: flex; gap: 6px;">
                    <button class="btn" onclick="startNativeScanner()" style="flex: 1;">▶ Włącz aparat</button>
                    <button class="btn btn-danger" onclick="stopNativeScanner()" style="flex: 1;">⏹ Wyłącz</button>
                </div>
            </div>

            <div class="card">
                <label>Wpisz kod ręcznie lub zasymuluj:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="manual-input-code" placeholder="Wprowadź kod kreskowy lub QR...">
                    <button class="btn" onclick="verifyTicket(document.getElementById('manual-input-code').value)" style="width: 100px;">Sprawdź</button>
                </div>
            </div>
        </div>

        <!-- PANEL 2: GENERATOR MASOWY -->
        <div class="panel" id="panel-generator">
            <div class="card">
                <h3 style="margin: 0 0 10px 0; font-size: 0.95rem; color: #f472b6;">✨ Ekstremalny Generator Kodów</h3>
                
                <div class="row-group">
                    <div class="form-group">
                        <label>Zestaw znaków:</label>
                        <select id="gen-type">
                            <option value="alphanumeric">Litery + Cyfry</option>
                            <option value="numeric">Tylko Cyfry</option>
                            <option value="alpha">Tylko Litery</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Długość kodu:</label>
                        <input type="number" id="gen-length" value="10" min="4" max="32">
                    </div>
                </div>

                <div class="row-group">
                    <div class="form-group">
                        <label>Ilość sztuk:</label>
                        <input type="number" id="gen-count" value="20" min="1" max="1000">
                    </div>
                    <div class="form-group">
                        <label>Opcjonalny Prefiks:</label>
                        <input type="text" id="gen-prefix" placeholder="np. VIP-">
                    </div>
                </div>

                <button class="btn btn-success" onclick="generateBatchCodes()">⚡ Wygeneruj i zapisz w bazie</button>
            </div>

            <div class="card">
                <h3 style="margin: 0 0 10px 0; font-size: 0.95rem; color: #f472b6;">📥 Import Listy Kodów</h3>
                <div class="form-group">
                    <label>Wklej kody z pliku/kartki (oddzielone przecinkiem lub enterem):</label>
                    <textarea id="import-textarea" rows="3" placeholder="Wklej kody..."></textarea>
                </div>
                <button class="btn btn-purple" onclick="importCustomCodes()">Zaimportuj kody</button>
            </div>
        </div>

        <!-- PANEL 3: ZARZĄDZANIE BAZĄ -->
        <div class="panel" id="panel-database">
            <div class="card">
                <div class="form-group" style="margin-bottom: 8px;">
                    <input type="text" id="search-input" placeholder="🔍 Szukaj kodu w bazie..." oninput="updateUI()">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 0.75rem; color: #f7a8d8;" id="filter-info">Wszystkie kody</span>
                    <button class="btn btn-danger" onclick="clearAllTickets()" style="padding: 4px 8px; font-size: 0.68rem; width: auto;">Wyczyść bazę</button>
                </div>
                <div class="ticket-list" id="ticketListContainer"></div>
            </div>
            <div class="card" style="display: flex; gap: 6px;">
                <button class="btn btn-purple" onclick="exportData()" style="font-size:0.8rem;">📤 Eksportuj JSON</button>
                <button class="btn" onclick="importDataPrompt()" style="font-size:0.8rem;">📥 Import JSON</button>
            </div>
        </div>

        <!-- PANEL 4: USTAWIENIA -->
        <div class="panel" id="panel-settings">
            <div class="card">
                <h3 style="margin: 0 0 12px 0; font-size: 0.95rem; color: #f472b6;">⚙️ Reguły i Limity Wstępu</h3>

                <div class="form-group">
                    <label>Dozwolona liczba wejść na 1 kod:</label>
                    <select id="setting-max-uses" onchange="saveSettings()">
                        <option value="1">1 raz (jednorazowy bilet)</option>
                        <option value="2">2 razy (wejście + wyjście + powrót)</option>
                        <option value="3">3 razy</option>
                        <option value="5">5 razy</option>
                        <option value="999999" selected>Nieskończoność (wielokrotny wstęp)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Obsługa wychodzenia (Przełącznik Wejście/Wyjście):</label>
                    <select id="setting-enable-exit" onchange="saveSettings()">
                        <option value="off">Wyłączone (Tylko wejścia)</option>
                        <option value="on">Włączone (Możliwość wyjść i powrotów)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Maksymalny limit gości / uczestników:</label>
                    <input type="number" id="setting-max-guests" value="150" onchange="saveSettings()">
                </div>

                <div class="form-group">
                    <label>Dźwięki powiadomień:</label>
                    <select id="setting-sound" onchange="saveSettings()">
                        <option value="on">Włączone (Beep)</option>
                        <option value="off">Wyłączone</option>
                    </select>
                </div>

                <button class="btn btn-success" onclick="alert('Zapisano pomyślnie!')" style="margin-top: 10px;">💾 Zapisz konfigurację</button>
            </div>
        </div>

    </div>

    <!-- PEŁNOEKRANOWY MODAL SUKCESU -->
    <div id="modal-success" class="modal-overlay">
        <div class="modal-card modal-success">
            <button class="close-x-btn" onclick="closeModal()">✕</button>
            <div class="modal-icon-circle success-circle">👤✓</div>
            <div class="modal-title" style="color: #34d399;">BILET WAŻNY!</div>
            <div class="modal-code-txt" id="success-code-display">ABC12345</div>
            <div class="modal-desc" id="success-desc-text">Wejście zatwierdzone pomyślnie.</div>
            <button class="close-modal-btn" onclick="closeModal()">Zamknij (5s)</button>
            <div class="timer-bar-container"><div class="timer-bar-fill" id="success-timer-bar"></div></div>
        </div>
    </div>

    <!-- PEŁNOEKRANOWY MODAL BŁĘDU -->
    <div id="modal-error" class="modal-overlay">
        <div class="modal-card modal-error">
            <button class="close-x-btn" onclick="closeModal()">✕</button>
            <div class="modal-icon-circle error-circle">👤✕</div>
            <div class="modal-title" style="color: #ef4444;" id="error-title-text">KOD NIEWAŻNY!</div>
            <div class="modal-code-txt" id="error-code-display">ABC12345</div>
            <div class="modal-desc" id="error-desc-text">Błąd weryfikacji kodu.</div>
            <button class="close-modal-btn" onclick="closeModal()">Zamknij (5s)</button>
            <div class="timer-bar-container"><div class="timer-bar-fill" id="error-timer-bar"></div></div>
        </div>
    </div>

    <!-- Skrypt logiki i superszybkiego skanera BarcodeDetector -->
    <script>
        let tickets = JSON.parse(localStorage.getItem('passextreme_tickets')) || [
            { code: "123456789", uses: 0, maxUses: 999999 },
            { code: "VIP-PASS-2026", uses: 0, maxUses: 1 }
        ];

        let settings = JSON.parse(localStorage.getItem('passextreme_settings')) || {
            maxUses: 999999,
            maxGuests: 150,
            sound: "on",
            enableExit: "off"
        };

        let videoStream = null;
        let scanInterval = null;
        let isScanning = false;
        let lastScannedCode = "";
        let lastScanTime = 0;
        let currentDirection = "in";
        let modalTimeout = null;

        window.onload = () => {
            loadSettingsToUI();
            updateUI();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(tabId === 'scan') {
                document.getElementById('panel-scan').classList.add('active');
                event.target.classList.add('active');
            } else {
                stopNativeScanner();
                if(tabId === 'generator') document.getElementById('panel-generator').classList.add('active');
                if(tabId === 'database') document.getElementById('panel-database').classList.add('active');
                if(tabId === 'settings') document.getElementById('panel-settings').classList.add('active');
                event.target.classList.add('active');
            }
        }

        function loadSettingsToUI() {
            document.getElementById('setting-max-uses').value = settings.maxUses;
            document.getElementById('setting-max-guests').value = settings.maxGuests;
            document.getElementById('setting-sound').value = settings.sound;
            document.getElementById('setting-enable-exit').value = settings.enableExit;
            updateDirectionToggleVisibility();
        }

        function saveSettings() {
            settings.maxUses = parseInt(document.getElementById('setting-max-uses').value);
            settings.maxGuests = parseInt(document.getElementById('setting-max-guests').value);
            settings.sound = document.getElementById('setting-sound').value;
            settings.enableExit = document.getElementById('setting-enable-exit').value;
            localStorage.setItem('passextreme_settings', JSON.stringify(settings));
            updateDirectionToggleVisibility();
            updateUI();
        }

        function updateDirectionToggleVisibility() {
            let toggleBar = document.getElementById('directionToggleBar');
            if (settings.enableExit === "on") {
                toggleBar.style.display = "grid";
            } else {
                toggleBar.style.display = "none";
                currentDirection = "in";
            }
        }

        function setScanDirection(dir) {
            currentDirection = dir;
            let btnIn = document.getElementById('btnModeIn');
            let btnOut = document.getElementById('btnModeOut');
            if (dir === 'in') {
                btnIn.className = "dir-btn active-in";
                btnOut.className = "dir-btn";
            } else {
                btnIn.className = "dir-btn";
                btnOut.className = "dir-btn active-out";
            }
        }

        function updateUI() {
            localStorage.setItem('passextreme_tickets', JSON.stringify(tickets));
            
            document.getElementById('stat-total').innerText = tickets.length;
            let usedCount = tickets.filter(t => t.uses > 0).length;
            document.getElementById('stat-scanned').innerText = usedCount;
            document.getElementById('stat-max').innerText = settings.maxGuests;
            document.getElementById('db-count').innerText = `${tickets.length} kodów`;

            let searchQuery = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : "";
            let container = document.getElementById('ticketListContainer');
            if(!container) return;

            let filtered = tickets.filter(t => t.code.toLowerCase().includes(searchQuery));

            if(filtered.length === 0) {
                container.innerHTML = '<div style="color: #f7a8d8; font-size: 0.75rem; text-align: center; padding: 10px;">Brak pasujących kodów.</div>';
                return;
            }

            container.innerHTML = '';
            filtered.slice().reverse().forEach((t, idx) => {
                let realIdx = tickets.indexOf(t);
                let div = document.createElement('div');
                div.className = 'ticket-item';
                div.innerHTML = `
                    <div class="ticket-info">
                        <span class="ticket-code">${t.code}</span>
                        <span class="ticket-meta">Użycia: ${t.uses} / ${t.maxUses === 999999 ? '∞' : t.maxUses}</span>
                    </div>
                    <div class="ticket-actions">
                        <button class="icon-btn" onclick="verifyTicket('${t.code}')" title="Sprawdź">✔️</button>
                        <button class="icon-btn" onclick="resetTicket(${realIdx})" title="Resetuj" style="background:#059669;">🔄</button>
                        <button class="icon-btn" onclick="deleteTicket(${realIdx})" title="Usuń" style="background:#ef4444;">🗑️</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- NATYWNY BŁYSKAWICZNY SKANER (BARCODEDETECTOR) ---
        async function startNativeScanner() {
            if (isScanningActive) return;

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                });

                const videoEl = document.getElementById("scanner-video");
                videoEl.srcObject = videoStream;
                await videoEl.play();
                isScanningActive = true;

                // Sprawdzenie wsparcia BarcodeDetector
                if (!('BarcodeDetector' in window)) {
                    alert("Twoja przeglądarka nie wspiera natywnego skanera. Użyj pola ręcznego wprowadzania.");
                    return;
                }

                const barcodeDetector = new BarcodeDetector({
                    formats: ['code_128', 'ean_13', 'ean_8', 'qr_code', 'upc_a', 'upc_e', 'code_39', 'itf']
                });

                scanInterval = setInterval(async () => {
                    if (!isScanningActive) return;
                    try {
                        const barcodes = await barcodeDetector.detect(videoEl);
                        if (barcodes.length > 0) {
                            let code = barcodes[0].rawValue;
                            let now = Date.now();
                            if (code && (code !== lastScannedCode || (now - lastScanTime) > 3000)) {
                                lastScannedCode = code;
                                lastScanTime = now;
                                verifyTicket(code);
                            }
                        }
                    } catch (e) {
                        // Ignoruj błędy pojedynczych klatek
                    }
                }, 150); // Skanowanie co 150ms dla maksymalnej płynności i szybkości

            } catch (err) {
                console.error("Błąd kamery:", err);
                alert("Nie można uruchomić aparatu. Sprawdź uprawnienia w przeglądarce.");
            }
        }

        function stopNativeScanner() {
            isScanningActive = false;
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            let videoEl = document.getElementById('scanner-video');
            if (videoEl) videoEl.srcObject = null;
        }

        // --- WERYFIKACJA BILETU I WYWOŁANIE MODALI ---
        function verifyTicket(code) {
            code = code.trim();
            if (!code) return;

            let ticket = tickets.find(t => t.code === code);
            let maxLimit = ticket && ticket.maxUses !== undefined ? ticket.maxUses : settings.maxUses;

            // TRYB WYJŚCIA
            if (settings.enableExit === "on" && currentDirection === "out") {
                if (!ticket || ticket.uses <= 0) {
                    showErrorModal(code, "BŁĄD WYJŚCIA", "Ten kod nie był użyty lub nie istnieje!");
                    return;
                }
                ticket.uses -= 1;
                updateUI();
                showSuccessModal(code, `WYJŚCIE ZATWIERDZONE! Pozostało użyć: ${ticket.uses}`);
                return;
            }

            // TRYB WEJŚCIA
            if (!ticket) {
                showErrorModal(code, "KOD NIEZNANY", "Ten kod nie istnieje w bazie danych!");
                return;
            }

            if (ticket.uses >= maxLimit) {
                showErrorModal(code, "KOD JUŻ WYKORZYSTANY", `Użyto już ${ticket.uses} / ${maxLimit === 999999 ? '∞' : maxLimit} razy!`);
                return;
            }

            ticket.uses += 1;
            updateUI();
            showSuccessModal(code, `WEJŚCIE ZATWIERDZONE! (${ticket.uses} / ${maxLimit === 999999 ? '∞' : maxLimit})`);
        }

        // --- OBSŁUGA PEŁNOEKRANOWYCH MODALI ---
        function showSuccessModal(code, desc) {
            if(settings.sound === "on") playBeep(900, 150);
            document.getElementById('success-code-display').innerText = code;
            document.getElementById('success-desc-text').innerText = desc;
            
            // Restart animacji paska czasu
            let bar = document.getElementById('success-timer-bar');
            bar.style.animation = 'none';
            bar.offsetHeight; 
            bar.style.animation = 'shrinkBar 5s linear forwards';

            document.getElementById('modal-success').style.display = 'flex';
            document.getElementById('modal-error').style.display = 'none';

            clearTimeout(modalTimeout);
            modalTimeout = setTimeout(() => { closeModal(); }, 5000);
        }

        function showErrorModal(code, title, desc) {
            if(settings.sound === "on") {
                playBeep(250, 200);
                setTimeout(() => playBeep(180, 300), 220);
            }
            document.getElementById('error-title-text').innerText = title;
            document.getElementById('error-code-display').innerText = code;
            document.getElementById('error-desc-text').innerText = desc;

            let bar = document.getElementById('error-timer-bar');
            bar.style.animation = 'none';
            bar.offsetHeight;
            bar.style.animation = 'shrinkBar 5s linear forwards';

            document.getElementById('modal-error').style.display = 'flex';
            document.getElementById('modal-success').style.display = 'none';

            clearTimeout(modalTimeout);
            modalTimeout = setTimeout(() => { closeModal(); }, 5000);
        }

        function closeModal() {
            clearTimeout(modalTimeout);
            document.getElementById('modal-success').style.display = 'none';
            document.getElementById('modal-error').style.display = 'none';
            document.getElementById('manual-input-code').value = '';
        }

        // --- GENERATOR I BAZA ---
        function generateBatchCodes() {
            let type = document.getElementById('gen-type').value;
            let length = parseInt(document.getElementById('gen-length').value) || 8;
            let count = parseInt(document.getElementById('gen-count').value) || 10;
            let prefix = document.getElementById('gen-prefix').value.trim();

            let chars = "";
            if (type === 'alphanumeric') chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            else if (type === 'numeric') chars = "0123456789";
            else if (type === 'alpha') chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            let addedCount = 0;
            for (let i = 0; i < count; i++) {
                let code = prefix;
                for (let j = 0; j < length; j++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                if (!tickets.some(t => t.code === code)) {
                    tickets.push({ code: code, uses: 0, maxUses: settings.maxUses });
                    addedCount++;
                }
            }

            updateUI();
            alert(`Wygenerowano pomyślnie ${addedCount} kodów!`);
            switchTab('database');
        }

        function importCustomCodes() {
            let text = document.getElementById('import-textarea').value.trim();
            if (!text) { alert("Wklej jakieś kody!"); return; }

            let lines = text.split(/[\n,]+/).map(c => c.trim()).filter(c => c.length > 0);
            let added = 0;

            lines.forEach(code => {
                if (!tickets.some(t => t.code === code)) {
                    tickets.push({ code: code, uses: 0, maxUses: settings.maxUses });
                    added++;
                }
            });

            document.getElementById('import-textarea').value = '';
            updateUI();
            alert(`Zaimportowano pomyślnie ${added} kodów!`);
            switchTab('database');
        }

        function resetTicket(index) { tickets[index].uses = 0; updateUI(); }
        function deleteTicket(index) { if(confirm("Usunąć ten kod?")) { tickets.splice(index, 1); updateUI(); } }
        function clearAllTickets() { if(confirm("Wyczyścić całą bazę?")) { tickets = []; updateUI(); } }

        function exportData() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tickets));
            let dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "passscan_backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importDataPrompt() {
            let jsonTxt = prompt("Wklej zawartość pliku JSON z kopią zapasową:");
            if(jsonTxt) {
                try {
                    let parsed = JSON.parse(jsonTxt);
                    if(Array.isArray(parsed)) { tickets = parsed; updateUI(); alert("Przywrócono bazę danych!"); }
                } catch(e) { alert("Nieprawidłowy format JSON!"); }
            }
        }

        function playBeep(freq, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + (duration / 1000));
            } catch (e) {}
        }
    </script>
